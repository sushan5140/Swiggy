name: Day 1 scenario integrity

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check synthetic fixture integrity
        run: node scripts/validate_day01_fixtures.mjs
