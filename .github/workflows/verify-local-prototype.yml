name: Verify local synthetic prototype
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - name: Preserve benchmark and audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-prototype-evidence
          path: reports/
          if-no-files-found: ignore
